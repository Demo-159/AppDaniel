<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruta B: sesión</title>
<style>
/* Reproductor genérico de sesiones con tutor. Lee window.SESSION (pasos, escenas, audio, práctica). */
:root{--bg:#131F24;--card:#1E2B32;--line:#37464F;--ink:#F1F7FB;--muted:#9AB0BC;--green:#58CC02;--greend:#46A302;--blue:#1CB0F6;--blued:#1899D6;--red:#FF4B4B;--gold:#FFC800;--orange:#FF9600;--ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;justify-content:center}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;padding:12px 16px 16px;position:relative}
.top{display:flex;align-items:center;gap:12px}
.top .x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.bar{flex:1;height:14px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .5s}
.cc{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-family:var(--ui);font-weight:900;cursor:pointer}.cc.on{color:var(--ink);border-color:var(--ink)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;position:relative;text-align:center}
.card{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:10px 14px;text-align:left;animation:pop .35s}
.card .ic{font-size:30px}.card b{display:block;font-size:18px;color:var(--gold)}.card span{font-weight:800;color:var(--muted);font-size:14px}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes drive{from{transform:translate(0px,118px)}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.cifra .n{font-size:64px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.cifra .u{font-size:20px;font-weight:900;color:var(--ink);margin-top:6px}
.cifra .s{font-size:15px;font-weight:800;color:var(--muted);margin-top:4px}
.cifra .ic{font-size:46px;margin-bottom:6px}
.barras{width:100%;display:flex;flex-direction:column;gap:14px}
.barra{display:flex;align-items:center;gap:10px;font-weight:900}
.barra .l{width:96px;text-align:left;font-size:15px}.barra .t{flex:1;height:30px;border-radius:9px;background:var(--line);overflow:hidden}
.barra .t i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s ease}.barra .v{width:62px;text-align:right;font-size:20px;color:var(--gold)}
.iconos{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:340px}
.iconos span{font-size:var(--s,24px);opacity:.25;animation:up .3s both}.iconos span.on{opacity:1}
.sub{font-weight:800;color:var(--muted);font-size:15px}
.lista{width:100%;display:flex;flex-direction:column;gap:10px}
.lista div{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;font-weight:900;font-size:17px;text-align:left;animation:up .35s both}
.lista div i{font-style:normal;font-size:28px}
.titulo .ic{font-size:72px}.titulo h1{margin:10px 0 0;font-size:26px}
.img{max-width:92%;max-height:240px;border-radius:14px;background:#fff;padding:8px;animation:pop .35s}
.vs{display:flex;gap:16px;align-items:stretch;width:100%}
.vs>div{flex:1;background:var(--card);border-radius:16px;padding:14px 8px;animation:up .35s both}
.vs .ic{font-size:40px}.vs b{display:block;font-size:17px;margin-top:6px}.vs span{color:var(--muted);font-weight:800;font-size:13px}
.vs .no{border:2px solid var(--red)}.vs .si{border:2px solid var(--green)}
svg{width:100%;height:auto}
.choices{width:100%;display:flex;flex-direction:column;gap:10px}
.opt{font-family:var(--ui);font-weight:900;font-size:17px;text-align:left;padding:14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--green);color:var(--green)}.opt.bad{border-color:var(--red);color:var(--red)}.opt.sel{border-color:var(--blue);color:var(--blue)}
.ask{width:100%;background:var(--card);border:2px solid var(--blue);border-radius:16px;padding:12px 14px;font-weight:900;font-size:18px;text-align:left}
.slider{width:100%}.slider input{width:100%;accent-color:var(--gold);height:34px}
.meter{width:100%;height:26px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;transition:width .4s,background .4s}
.bub{min-height:0;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;margin-top:8px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;margin-top:10px;font-family:var(--ui);font-weight:900;font-size:17px;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blued);cursor:pointer;text-transform:uppercase}
.btn.g{background:var(--green);box-shadow:0 5px 0 var(--greend)}.btn.r{background:var(--red);box-shadow:0 5px 0 #C81E1E}
.btn:disabled{background:var(--line);box-shadow:0 5px 0 #2a363d;color:var(--muted)}
.start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:9}
.start h1{margin:0;font-size:26px}.start p{margin:0;color:var(--muted);font-weight:800}
.fb{border-radius:14px;padding:12px;font-weight:900;margin-top:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>
<div class="start" id="start"><div style="font-size:64px" id="sic"></div><h1 id="stitle"></h1><p id="ssub"></p><button class="btn g" id="go" style="max-width:320px">Empezar</button></div>
<div class="app">
 <div class="top"><button class="x" onclick="history.back()" aria-label="Salir">✕</button><div class="bar"><i id="prog"></i></div><button class="cc" id="cc" aria-pressed="false">CC</button></div>
 <div class="stage" id="stage"></div>
 <div id="bub" class="bub" hidden></div>
 <div id="foot"></div>
</div>
<script>
const S=window.SESSION, $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const audio=new Audio(); let cc=false;
$('cc').onclick=()=>{cc=!cc;$('cc').classList.toggle('on',cc);if(!cc)$('bub').hidden=true};
function say(key){return new Promise(res=>{const a=S.audio[key];
 if(cc){$('bub').hidden=false;$('bub').textContent=S.textos[key]}
 if(!a){setTimeout(res,1800);return}
 audio.src=a;audio.onended=()=>setTimeout(res,420);audio.play().catch(()=>setTimeout(res,1800))})}
const stage=$('stage'),foot=$('foot');
const fmt=n=>Number(n).toLocaleString('es-CL',{maximumFractionDigits:1});
function countUp(el,to,ms=1100){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);const v=to*(1-Math.pow(1-k,3));el.textContent=(el.dataset.pre||'')+fmt(Number.isInteger(to)?Math.round(v):Math.round(v*10)/10);if(k<1)requestAnimationFrame(f)})(t0)}
// ---------- escenas ----------
const ESC={
 titulo:e=>`<div class="titulo"><div class="ic">${e.icono||'📘'}</div><h1>${e.texto}</h1></div>`,
 tarjeta:e=>`<div class="card"><div class="ic">${e.icono||'💡'}</div><div><b>${e.titulo}</b>${e.texto?`<span>${e.texto}</span>`:''}</div></div>`,
 cifra:e=>`<div class="cifra">${e.icono?`<div class="ic">${e.icono}</div>`:''}<div class="n" data-to="${e.valor}" data-pre="${e.prefijo||''}">${e.prefijo||''}0</div><div class="u">${e.unidad||''}</div>${e.sub?`<div class="s">${e.sub}</div>`:''}</div>`,
 barras:e=>`<div class="barras">${e.items.map(i=>`<div class="barra"><div class="l">${i.label}</div><div class="t"><i data-w="${i.valor/(e.max||100)*100}" style="background:${i.color||'var(--blue)'}"></i></div><div class="v">${i.texto||i.valor+(e.unidad||'')}</div></div>`).join('')}</div>${e.sub?`<div class="sub">${e.sub}</div>`:''}`,
 iconos:e=>`<div class="iconos" style="--s:${e.n<=12?52:e.n<=40?32:24}px">${Array.from({length:e.n},(_,i)=>`<span class="${i<(e.marcar??e.n)?'on':''}" style="animation-delay:${Math.min(i*25,1200)}ms">${i<(e.marcar??e.n)?(e.icono):(e.icono2||e.icono)}</span>`).join('')}</div>${e.sub?`<div class="sub">${e.sub}</div>`:''}`,
 lista:e=>`<div class="lista">${e.items.map((i,k)=>`<div style="animation-delay:${k*350}ms"><i>${i.icono}</i>${i.texto}</div>`).join('')}</div>`,
 vs:e=>`<div class="vs">${e.items.map((i,k)=>`<div class="${i.marca||''}" style="animation-delay:${k*300}ms"><div class="ic">${i.icono}</div><b>${i.titulo}</b>${i.texto?`<span>${i.texto}</span>`:''}</div>`).join('')}</div>`,
 imagen:e=>`<img class="img" src="${S.imagenes[e.src]||e.src}" alt="">${e.sub?`<div class="sub">${e.sub}</div>`:''}`,
 peaton:e=>peatonSVG(e.velocidad||30),
};
function show(e){if(!e)return;const html=ESC[e.tipo](e);
 if(e.sobre){const c=stage.querySelector('.extra')||document.createElement('div');c.className='extra';c.style.width='100%';c.innerHTML=html;stage.appendChild(c)}
 else stage.innerHTML=html;
 stage.querySelectorAll('[data-to]').forEach(el=>countUp(el,+el.dataset.to));
 requestAnimationFrame(()=>stage.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%'))}
// pedestrian scene: speed and survival (book data, chapter 1)
function surv(v){return v<=30?{t:'9 de cada 10 sobreviven',w:90,c:'var(--green)'}:v<45?{t:'Cada vez menos sobreviven',w:70-(v-30)*1.3,c:'var(--gold)'}:v<65?{t:'Menos de la mitad sobrevive',w:45-(v-45)*1.5,c:'var(--orange)'}:{t:'Lo más probable es que muera',w:8,c:'var(--red)'}}
function peatonSVG(v){const s=surv(v);return `<svg viewBox="0 0 360 150"><rect y="60" width="360" height="70" fill="#2B3A42"/><rect y="56" width="360" height="4" fill="#4C5E68"/>
 <g transform="translate(${40+v*1.6},118)" style="animation:drive .9s ease-out"><rect x="-56" y="-26" width="56" height="26" rx="8" fill="#FF4B4B"/><path d="M-46 -26 L-38 -40 H-16 L-8 -26 Z" fill="#FF4B4B"/><circle cx="-44" r="8" fill="#111"/><circle cx="-12" r="8" fill="#111"/></g>
 <text x="320" y="112" font-size="38" text-anchor="middle">🚶</text></svg>
 <div style="font-size:44px;font-weight:900;color:var(--gold)">${v} <small style="font-size:18px;color:var(--muted)">km/h</small></div>
 <div class="meter"><i style="width:${s.w}%;background:${s.c}"></i></div><div class="sub" style="color:${s.c}">${s.t}</div>`}
// ---------- interacciones ----------
async function elige(p){const it=p.elige;
 stage.innerHTML=`<div class="ask">❓ ${it.pregunta}</div><div class="choices">${shuffle(it.opciones.map((o,i)=>({o,i}))).map(x=>`<button class="opt" data-i="${x.i}">${x.o}</button>`).join('')}</div>`;
 if(p.voz)say(p.voz);
 while(true){const b=await new Promise(r=>stage.querySelectorAll('.opt').forEach(o=>o.onclick=()=>r(o)));audio.pause();
  if(+b.dataset.i===0){b.classList.add('good');stage.querySelectorAll('.opt').forEach(o=>o.disabled=true);if(it.bien)await say(it.bien);return}
  b.classList.add('bad');b.disabled=true;if(it.mal)await say(it.mal)}}
async function desliza(p){const d=p.desliza;let v=d.desde;
 const draw=()=>{stage.innerHTML=ESC[d.escena]({velocidad:v})};draw();
 foot.innerHTML=`<div class="slider"><input type="range" min="${d.min}" max="${d.max}" step="${d.paso}" value="${v}" aria-label="${d.etiqueta||'Valor'}"></div>`;
 const inp=foot.querySelector('input');inp.oninput=()=>{v=+inp.value;draw()};
 if(p.voz)await say(p.voz);
 await new Promise(r=>{const c=()=>{if(v>=d.hasta){inp.removeEventListener('input',c);r()}};inp.addEventListener('input',c);c()});
 foot.innerHTML=''}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
// ---------- práctica al final ----------
async function practica(){const qs=shuffle(S.practica).slice(0,S.maxPractica||4);let ok=0;
 for(const q of qs){const K=q.k||1,picks=new Set();let sel=null;
  stage.innerHTML=`<div style="width:100%;text-align:left"><div style="color:var(--gold);font-weight:900;font-size:13px;letter-spacing:1px">PRÁCTICA${K>1?' · MARCA '+K:''}</div><div style="font-weight:900;font-size:19px;margin:6px 0">${q.q}</div>${q.i?`<img class="img" style="display:block;margin:0 auto 8px;max-height:150px" src="${q.i}">`:''}<div class="choices">${shuffle(q.o.map((o,i)=>({o,i}))).map(x=>`<button class="opt" data-i="${x.i}">${x.o}</button>`).join('')}</div><div id="pfb"></div></div>`;
  foot.innerHTML='<button class="btn g" id="chk" disabled>Comprobar</button>';const chk=$('chk');
  stage.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{const i=+o.dataset.i;if(K>1){if(picks.has(i)){picks.delete(i);o.classList.remove('sel')}else if(picks.size<K){picks.add(i);o.classList.add('sel')}chk.disabled=picks.size!==K}else{stage.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');sel=i;chk.disabled=false}});
  await new Promise(r=>chk.onclick=r);
  const good=K>1?[...picks].every(i=>i<K):sel===0;if(good)ok++;
  stage.querySelectorAll('.opt').forEach(o=>{o.onclick=null;const i=+o.dataset.i;if(i<K)o.classList.add('good');else if(i===sel||picks.has(i))o.classList.add('bad')});
  $('pfb').innerHTML=`<div class="fb" style="background:${good?'#203A12':'#3D1A1C'};color:${good?'var(--green)':'var(--red)'}">${good?'¡Bien hecho!':'Revisa las correctas en verde'}<div style="color:var(--ink);font-weight:800;font-size:14px;margin-top:4px">${q.e} <span style="color:var(--muted)">· Libro, pág. ${q.p}</span></div></div>`;
  foot.innerHTML='<button class="btn" id="nx">Continuar</button>';await new Promise(r=>$('nx').onclick=r)}
 stage.innerHTML=`<div style="font-size:70px">🏆</div><h2 style="margin:0">¡Sesión completa!</h2><div class="sub">${ok} de ${qs.length} correctas en la práctica</div>`;
 foot.innerHTML='<button class="btn g" onclick="history.back()">Volver al mapa</button>'}
// ---------- bucle principal ----------
async function run(){const P=S.pasos;
 for(let i=0;i<P.length;i++){const p=P[i];$('prog').style.width=(i/P.length*85)+'%';
  if(p.elige)await elige(p);
  else if(p.desliza)await desliza(p);
  else{show(p.escena);if(p.voz)await say(p.voz);if(p.pausa)await sleep(p.pausa)}}
 $('prog').style.width='90%';$('bub').hidden=true;await practica();$('prog').style.width='100%'}
$('sic').textContent=S.icono||'📘';$('stitle').textContent=S.titulo;$('ssub').textContent=`Sesión con tutor · ${S.minutos||3} min · con sonido 🔊`;
$('go').onclick=()=>{$('start').remove();audio.play().catch(()=>{});run()};
</script></body></html>
